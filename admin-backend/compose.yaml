name: teachteamapp
services:
  mysql:
    image: "mysql:8.4.9"
    container_name: teachteamapp-mysql-1
    hostname: teachteamapp-mysql-1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: teachteamapp
      # POSTGRES_DB: teachteamapp
    volumes:
      - "./initdb/:/docker-entrypoint-initdb.d/"
    ports:
      - "3306:3306"
    networks:
      - default

  backend:
    image: "quocan1410/teachteamapp:latest"
    # build:
    #   context: ./
    #   dockerfile: ./Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - "./.env.docker:/app/.env"
    networks:
      - default
  # minio:
  #   image: "minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   command: "server /data --console-address ':9001'"
networks:
  default:
    name: teachteam-net
